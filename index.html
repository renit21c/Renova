<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Renova</title>
    <link rel="stylesheet" href="public/styles.css" />
    <link rel="stylesheet" href="public/mobile.css" />
    <link rel="stylesheet" href="public/light-theme.css" />
    <link rel="stylesheet" href="public/workspace-features.css" />
    <link rel="stylesheet" href="public/design.css" />
    <link rel="stylesheet" href="public/soft-ui.css" />
    <link rel="stylesheet" href="public/mobile-ui.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
    <div class="app-shell">
      <aside class="sidebar glass">
        <a class="brand" href="#home"><span class="brand-mark">R</span><span>Renova</span></a>
        <button id="mobileSidebarCollapse" class="sidebar-mobile-collapse" type="button" aria-label="Close navigation menu">Close menu</button>
        <nav id="nav" aria-label="Main navigation"></nav>
        <div class="sidebar-footer"><button id="themeButton" class="icon-button" title="Toggle appearance" aria-label="Toggle appearance"></button><button id="settingsButton" class="avatar" title="Settings" aria-label="Settings">?</button></div>
      </aside>
      <button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation" tabindex="-1"></button>
      <main>
        <header class="topbar glass"><button id="mobileMenu" class="icon-button mobile-only" aria-label="Open menu"></button><button id="searchButton" class="search-button" aria-label="Search Renova" title="Search"><span class="search-icon"></span><span class="search-label">Search</span><kbd>⌘ K</kbd></button><button id="quickButton" class="primary-button" aria-label="New record" title="New record"><span class="button-icon"></span><span>New</span></button></header>
        <section id="page" class="page" aria-live="polite"></section>
      </main>
    </div>
    <div id="modalRoot"></div>
    <div id="toast" role="status"></div>
    <script src="config.js"></script>
    <script src="public/finance-core.js"></script>
    <script src="public/workspace-features.js"></script>
    <script src="public/finance-features.js"></script>
    <script src="public/finance-layout.js"></script>
    <script src="public/soft-ui.js"></script>
    <script src="public/app.js"></script>
  </body>
</html>
